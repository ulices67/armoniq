name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build iOS App (Unsigned)
        working-directory: ios/Armoniq
        run: |
          xcodebuild clean build \
            -project Armoniq.xcodeproj \
            -scheme Armoniq \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        working-directory: ios/Armoniq
        run: |
          mkdir -p Payload
          # Move the .app folder to Payload
          mv build/Build/Products/Release-iphoneos/*.app Payload/
          # Zip it up as an .ipa
          zip -r Armoniq.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Armoniq-IPA
          path: ios/Armoniq/Armoniq.ipa
